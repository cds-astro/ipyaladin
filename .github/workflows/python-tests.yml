name: python-tests
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
      - dev
  # Allows to run this workflow manually from the Actions tab
  workflow_dispatch:
jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # oldest supported and newest
        python-version: ["3.10", "3.15"]
    steps:
      - name: "Checkout branch"
        uses: actions/checkout@v7
      - name: "Set up Python on Ubuntu"
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: "Pytest"
        run: |
          pip install ".[dev,recommended]"
          pytest .
